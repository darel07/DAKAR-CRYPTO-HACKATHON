services:
  caisse:
    build: .
    ports: ["8080:8080"]
    environment:
      PUBLIC_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_DEMO: "true"
      # IA facultative (sans configuration : règles locales). Voir backend/.env.example.
      IA_FOURNISSEUR: ${IA_FOURNISSEUR:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_URL_BASE: ${IA_URL_BASE:-}
      IA_CLE: ${IA_CLE:-}
      IA_MODELE: ${IA_MODELE:-}
    # Permet d'utiliser un modèle local (Ollama) de la machine hôte : IA_URL_BASE=http://host.docker.internal:11434/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["caisse-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  caisse-data:
