name: Backend

on:
  push:
    branches: [main, back, front]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique, pour le scan de secrets

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint . --max-warnings 0
      - run: npx tsc --noEmit
      - run: npx vitest run

      # Le front n'existe que là où app/ est présent (branche front, puis main après fusion).
      - name: Build du front
        id: front
        working-directory: .
        run: |
          if [ -f app/package.json ]; then
            (cd app && npm ci && npm test && npm run build)
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de dossier app/ sur cette branche : étapes Docker ignorées."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installation en une commande (docker compose up --wait)
        if: steps.front.outputs.present == 'true'
        working-directory: .
        run: docker compose up -d --build --wait

      - name: Vérifications de l'installation
        if: steps.front.outputs.present == 'true'
        working-directory: .
        run: |
          curl -fsS http://localhost:8080/api/sante
          curl -fsS http://localhost:8080/api/taux || echo "Cours indisponible (réseau de la CI) : toléré."
          curl -fsS http://localhost:8080/ | grep -q "<html"
          curl -fsS http://localhost:8080/api/passeports/demo000000 > /dev/null

      # Parcours réels (Playwright) contre la stack Docker : Chrome est préinstallé sur le runner.
      - name: Parcours navigateur (Playwright, mobile et ordinateur)
        if: steps.front.outputs.present == 'true'
        working-directory: app
        run: npx playwright test

      - name: Rapport Playwright (en cas d'échec)
        if: failure() && steps.front.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

      - name: Scan de secrets sur tout l'historique (gitleaks)
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose

      - name: Journaux du conteneur (en cas d'échec)
        if: failure() && steps.front.outputs.present == 'true'
        working-directory: .
        run: docker compose logs --no-color

      - name: Arrêt et nettoyage
        if: always() && steps.front.outputs.present == 'true'
        working-directory: .
        run: docker compose down --volumes
